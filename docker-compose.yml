volumes:
  mysql_data:
  static_volume:
  media_volume:

services:
  db:
    image: mysql:8.0
    container_name: m2-mysql
    restart: unless-stopped
    mem_limit: 768m
    mem_reservation: 512m
    networks:
      - web
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-m2shop}
      MYSQL_USER: ${MYSQL_USER:-m2shop}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-m2shop_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 30

  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: m2-django
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 384m
    networks:
      - web
    volumes:
      - static_volume:/app/backend/staticfiles
      - media_volume:/app/backend/media
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --fake-initial &&
             python manage.py collectstatic --noinput &&
             gunicorn m2shop.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"

  nginx:
    build: ./nginx
    container_name: m2-nginx
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 128m
    networks:
      - web
    ports:
      - "8080:80"
    volumes:
      - static_volume:/staticfiles:ro
      - media_volume:/media:ro
    depends_on:
      - web

networks:
  web:
    external: true
