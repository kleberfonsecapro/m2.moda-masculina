volumes:
  mysql_data:
  static_volume:
  media_volume:
  backup_data:

services:
  db:
    image: mysql:8.0
    container_name: m2-mysql
    restart: unless-stopped
    mem_limit: 768m
    mem_reservation: 512m
    networks:
      - db-network
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 30

  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: m2-django
    restart: unless-stopped
    # Defesa em profundidade: mesmo que a imagem seja construída sem USER,
    # o processo não sobe como root.
    user: "100:101"
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    mem_reservation: 384m
    networks:
      - web
      - db-network
    volumes:
      - static_volume:/app/backend/staticfiles
      - media_volume:/app/backend/media
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Precisa provar que a aplicação responde, não só que a porta abriu:
      # socket aberto com Django em 500 já aprovou deploy quebrado (D-080).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    command: >
      sh -c "python manage.py migrate --fake-initial &&
             python manage.py collectstatic --noinput &&
             gunicorn m2shop.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"

  nginx:
    build: ./nginx
    container_name: m2-nginx
    restart: unless-stopped
    # Defesa em profundidade: o processo não sobe como root.
    user: "101:101"
    security_opt:
      - no-new-privileges:true
    # Permite ao usuário sem privilégios escutar 80/443 dentro do container.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    mem_limit: 256m
    mem_reservation: 128m
    networks:
      - web
      # Compartilhada com o Traefik global (/home/kleber/traefik) para que ele
      # resolva "m2-nginx" e publique a aplicação na URL pública.
      - traefik_global
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - static_volume:/staticfiles:ro
      - media_volume:/media:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    healthcheck:
      # `/healthz` e um endpoint dedicado: a home deixa de ser o probe, entao
      # uma pagina quebrada nao derruba o deploy por timeout de healthcheck.
      test: ["CMD", "wget", "-q", "--spider", "--no-check-certificate", "https://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 5s
    depends_on:
      web:
        condition: service_healthy

  # Stack de backup 3-2-1 (Borg + Rclone + Telegram).
  # Fica no profile "backup" para NAO subir no deploy normal:
  #   docker compose --profile backup up -d backup
  # Redes: db-network (internal, acesso ao MySQL) + backup-network (egress para o offsite).
  backup:
    build:
      context: ./scripts/backup
    image: m2moda-masculina-backup:1.0.0
    container_name: m2-backup
    profiles: ["backup"]
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 128m
    env_file:
      - .env
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      BORG_REPO: /backup/repo
      BACKUP_AT_HOUR: ${BACKUP_AT_HOUR:-2}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-6}
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-30}
      SERVER_NAME: ${SERVER_NAME:-m2moda}
    volumes:
      - backup_data:/backup
      - media_volume:/media:ro
    networks:
      - backup-network
      - db-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/bash", "/opt/backup/healthcheck.sh"]
      interval: 1h
      timeout: 30s
      retries: 2
      start_period: 30m
    command: ["schedule"]

networks:
  web:
    external: true
  # Rede do Traefik global (stack /home/kleber/traefik). Criada por lá.
  traefik_global:
    external: true
  db-network:
    internal: true
  # Rede exclusiva do backup: sem porta publicada, apenas saida para o offsite.
  backup-network:
