# Configuração das ferramentas de desenvolvimento (não é dependência de runtime).
#
# O objetivo é ter UMA fonte para as regras de lint e formatação.
# As regras entram em modo relatório (AGENTS.md §7): só os erros reais
# (E9/F63/F7/F82) são tratados como bloqueantes, via `--select` explícito.

[tool.ruff]
target-version = "py312"
line-length = 88
# Migrations são geradas pelo Django: não são código mantido à mão.
exclude = [
    "**/migrations/**",
    "**/__pycache__/**",
]

[tool.black]
target-version = ["py312"]
line-length = 88
exclude = '''
/(
    \.git
  | \.venv
  | __pycache__
  | migrations
)/
'''
