upstream django {
    server m2-django:8000;
}

# Acesso direto ao container (http://host:8080): sempre redireciona para o TLS
# local. Esta porta e publicada no host, entao NAO confia em X-Forwarded-Proto:
# qualquer cliente poderia forjar o cabecalho e receber a aplicacao sem TLS,
# com o Django tratando a conexao como HTTPS (cookies Secure em texto puro).
server {
    listen 80;
    server_name _;
    server_tokens off;
    return 301 https://$host:8443$request_uri;
}

# Entrada exclusiva do Traefik global (service `m2` -> http://m2-nginx:8081).
# A porta 8081 NAO e publicada no host: so e alcancavel pelas redes Docker,
# entao o X-Forwarded-Proto que chega aqui vem do Traefik, que terminou o TLS
# na borda. Por isso este listener serve em HTTP puro, sem redirect.
server {
    listen 8081;
    server_name _;
    client_max_body_size 100M;
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    location /static/ {
        alias /staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location /media/ {
        alias /media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }
}

server {
    # `listen ... http2` esta deprecado no nginx >= 1.25; a forma atual e
    # habilitar HTTP/2 como diretiva separada.
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate /etc/nginx/certs/localhost.pem;
    ssl_certificate_key /etc/nginx/certs/localhost-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    client_max_body_size 100M;
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    location /static/ {
        alias /staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location /media/ {
        alias /media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
