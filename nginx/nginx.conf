upstream django {
    server m2-django:8000;
}

# Preserva o esquema original quando a requisição vem do proxy TLS (traefik).
# Sem isso, o Django veria X-Forwarded-Proto: http e desativaria
# SECURE_PROXY_SSL_HEADER/SECURE_SSL_REDIRECT a cada requisição.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# HTTP interno (80): consumido pelo traefik, que já terminou o TLS e faz o
# redirect 80->443 na borda. Não redirecionar aqui evita loop e o desvio para
# :8443, que contornava o TLS do Let's Encrypt (dívida D-060).
server {
    listen 80;
    server_name _;
    include /etc/nginx/snippets/app-locations.conf;
}

# HTTPS direto (porta 8443 publicada), apenas para diagnóstico. O TLS público
# é do traefik; o certificado abaixo é local e não substitui o da borda.
server {
    # `listen ... http2` esta deprecado no nginx >= 1.25; a forma atual e
    # habilitar HTTP/2 como diretiva separada.
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate /etc/nginx/certs/localhost.pem;
    ssl_certificate_key /etc/nginx/certs/localhost-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    include /etc/nginx/snippets/app-locations.conf;
}
