# Diretivas e locations comuns aos servidores HTTP (interno, atrás do
# traefik) e HTTPS (porta 8443, acesso direto de diagnóstico).
#
# Incluído no contexto `server` por /etc/nginx/conf.d/nginx.conf.
# Mantido fora de conf.d/ de propósito: conf.d/*.conf é incluído no contexto
# `http`, onde `location` seria inválido.

client_max_body_size 100M;
server_tokens off;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;

location /static/ {
    alias /staticfiles/;
    expires 30d;
    add_header Cache-Control "public, immutable";
}

location /media/ {
    alias /media/;
    expires 30d;
    add_header Cache-Control "public, immutable";
}

location / {
    proxy_pass http://django;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_redirect off;
}
