{% extends 'base.html' %}

{% block title %}Redefinir Senha{% endblock %}

{% block content %}
<section class="page-header">
    <div class="container">
        <h1>Redefinir Senha</h1>
        <p>Digite seu e-mail para receber o link de redefinição.</p>
    </div>
</section>

<section class="section">
    <div class="container">
        <div class="form-wrapper" style="max-width:480px;margin:0 auto">
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="id_email">E-mail</label>
                    <input type="email" name="email" id="id_email" class="form-control" required placeholder="seu@email.com">
                </div>
                {% if form.errors %}
                <div class="form-errors" style="color:var(--color-error);margin-bottom:16px">
                    {{ form.errors.email }}
                </div>
                {% endif %}
                <button type="submit" class="btn btn-primary btn-block">Enviar Link de Redefinição</button>
            </form>
            <div style="text-align:center;margin-top:16px">
                <a href="{% url 'accounts:login' %}">Voltar ao login</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
