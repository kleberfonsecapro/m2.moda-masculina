{% extends 'base.html' %}

{% block title %}E-mail Enviado{% endblock %}

{% block content %}
<section class="page-header">
    <div class="container">
        <h1>Verifique seu E-mail</h1>
    </div>
</section>

<section class="section">
    <div class="container">
        <div class="form-wrapper" style="max-width:480px;margin:0 auto;text-align:center">
            <i class="fas fa-envelope" style="font-size:3rem;color:var(--color-accent-text);margin-bottom:20px"></i>
            <p>Enviamos um link de redefinição de senha para o e-mail informado.</p>
            <p style="margin-top:12px;color:var(--color-light-gray);font-size:0.85rem">Se você não receber o e-mail em alguns minutos, verifique sua caixa de spam.</p>
            <div style="margin-top:24px">
                <a href="{% url 'accounts:login' %}" class="btn btn-outline">Voltar ao login</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
