{% extends 'base.html' %}

{% block title %}Senha Redefinida{% endblock %}

{% block content %}
<section class="page-header">
    <div class="container">
        <h1>Senha Redefinida com Sucesso!</h1>
    </div>
</section>

<section class="section">
    <div class="container">
        <div class="form-wrapper" style="max-width:480px;margin:0 auto;text-align:center">
            <i class="fas fa-check-circle" style="font-size:3rem;color:var(--color-success);margin-bottom:20px"></i>
            <p>Sua senha foi redefinida. Você já pode fazer login com a nova senha.</p>
            <div style="margin-top:24px">
                <a href="{% url 'accounts:login' %}" class="btn btn-primary">Fazer Login</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
