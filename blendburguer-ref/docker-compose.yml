volumes:
  mysql_data:
  static_volume:
  media_volume:

services:
  db:
    image: mysql:8.0
    container_name: blend-mysql
    restart: unless-stopped
    networks:
      - web
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: blendburguer
      MYSQL_USER: blend
      MYSQL_PASSWORD: sua_senha_aqui
      MYSQL_ROOT_PASSWORD: root_senha_aqui
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 30

  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: blend-django
    restart: unless-stopped
    networks:
      - web
    volumes:
      - static_volume:/app/backend/staticfiles
      - media_volume:/app/backend/media
    env_file:
      - .env
    environment:
      MYSQL_HOST: db
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn blendburguer.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"

  nginx:
    image: nginx:1.26-alpine
    container_name: blend-nginx
    restart: unless-stopped
    networks:
      - web
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/staticfiles:ro
      - media_volume:/media:ro
    depends_on:
      - web

networks:
  web:
    external: true
